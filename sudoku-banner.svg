<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- Sudoku grid -->
  <g transform="translate(40,30)">
    <rect x="0" y="0" width="240" height="240" fill="#111827" stroke="#818cf8" stroke-width="3"/>
    <!-- thin lines -->
    <g stroke="#4b5563" stroke-width="1">
      <line x1="26.6" y1="0" x2="26.6" y2="240"/>
      <line x1="53.3" y1="0" x2="53.3" y2="240"/>
      <line x1="106.6" y1="0" x2="106.6" y2="240"/>
      <line x1="133.3" y1="0" x2="133.3" y2="240"/>
      <line x1="186.6" y1="0" x2="186.6" y2="240"/>
      <line x1="213.3" y1="0" x2="213.3" y2="240"/>
      <line x1="0" y1="26.6" x2="240" y2="26.6"/>
      <line x1="0" y1="53.3" x2="240" y2="53.3"/>
      <line x1="0" y1="106.6" x2="240" y2="106.6"/>
      <line x1="0" y1="133.3" x2="240" y2="133.3"/>
      <line x1="0" y1="186.6" x2="240" y2="186.6"/>
      <line x1="0" y1="213.3" x2="240" y2="213.3"/>
    </g>
    <!-- thick 3x3 lines -->
    <g stroke="#818cf8" stroke-width="2.5">
      <line x1="80" y1="0" x2="80" y2="240"/>
      <line x1="160" y1="0" x2="160" y2="240"/>
      <line x1="0" y1="80" x2="240" y2="80"/>
      <line x1="0" y1="160" x2="240" y2="160"/>
    </g>
    <!-- sample filled digits -->
    <g fill="#e0e7ff" font-family="Trebuchet MS, sans-serif" font-size="20" text-anchor="middle">
      <text x="13" y="20">5</text>
      <text x="93" y="20">3</text>
      <text x="200" y="20">7</text>
      <text x="40" y="46">6</text>
      <text x="147" y="46">1</text>
      <text x="13" y="73">9</text>
      <text x="66" y="73">8</text>
      <text x="227" y="73">5</text>
      <text x="13" y="100">8</text>
      <text x="120" y="100">6</text>
      <text x="227" y="100">3</text>
      <g fill="#f472b6">
        <text x="93" y="126">6</text>
        <text x="147" y="126">2</text>
        <text x="200" y="126">8</text>
      </g>
      <text x="13" y="153">4</text>
      <text x="120" y="153">8</text>
      <text x="227" y="153">1</text>
      <text x="13" y="180">7</text>
      <text x="66" y="180">2</text>
      <text x="227" y="180">6</text>
      <text x="40" y="206">6</text>
      <text x="147" y="206">2</text>
      <text x="13" y="233">2</text>
      <text x="93" y="233">8</text>
      <text x="200" y="233">9</text>
    </g>
  </g>

  <!-- Title text -->
  <g font-family="Trebuchet MS, Verdana, sans-serif">
    <text x="330" y="120" font-size="46" font-weight="bold" fill="#f8fafc">Sudoku Solver</text>
    <text x="330" y="155" font-size="18" fill="#a5b4fc">Python + Tkinter · Backtracking Algorithm</text>
    <text x="330" y="195" font-size="15" fill="#94a3b8">Solve any valid 9×9 puzzle instantly</text>
  </g>

  <!-- decorative puzzle piece icon -->
  <g transform="translate(760,60)">
    <rect x="0" y="0" width="60" height="60" rx="10" fill="none" stroke="#f472b6" stroke-width="3"/>
    <text x="30" y="40" font-size="30" fill="#f472b6" text-anchor="middle" font-family="Trebuchet MS, sans-serif">9</text>
  </g>
</svg>
