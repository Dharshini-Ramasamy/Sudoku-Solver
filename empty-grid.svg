<svg viewBox="0 0 420 480" xmlns="http://www.w3.org/2000/svg">
  <!-- window frame -->
  <rect width="420" height="480" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <!-- title bar -->
  <rect x="0" y="0" width="420" height="34" rx="10" fill="#334155"/>
  <rect x="0" y="18" width="420" height="16" fill="#334155"/>
  <circle cx="20" cy="17" r="6" fill="#ef4444"/>
  <circle cx="40" cy="17" r="6" fill="#f59e0b"/>
  <circle cx="60" cy="17" r="6" fill="#22c55e"/>
  <text x="210" y="22" font-family="Trebuchet MS, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Sudoku Solver</text>

  <!-- grid -->
  <g transform="translate(45,55)">
    <rect x="0" y="0" width="330" height="330" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="36.6" y1="0" x2="36.6" y2="330"/>
      <line x1="73.3" y1="0" x2="73.3" y2="330"/>
      <line x1="146.6" y1="0" x2="146.6" y2="330"/>
      <line x1="183.3" y1="0" x2="183.3" y2="330"/>
      <line x1="256.6" y1="0" x2="256.6" y2="330"/>
      <line x1="293.3" y1="0" x2="293.3" y2="330"/>
      <line x1="0" y1="36.6" x2="330" y2="36.6"/>
      <line x1="0" y1="73.3" x2="330" y2="73.3"/>
      <line x1="0" y1="146.6" x2="330" y2="146.6"/>
      <line x1="0" y1="183.3" x2="330" y2="183.3"/>
      <line x1="0" y1="256.6" x2="330" y2="256.6"/>
      <line x1="0" y1="293.3" x2="330" y2="293.3"/>
    </g>
    <g stroke="#1e293b" stroke-width="2.5">
      <line x1="110" y1="0" x2="110" y2="330"/>
      <line x1="220" y1="0" x2="220" y2="330"/>
      <line x1="0" y1="110" x2="330" y2="110"/>
      <line x1="0" y1="220" x2="330" y2="220"/>
    </g>
    <!-- some pre-filled clues, rest blank -->
    <g fill="#1e293b" font-family="Consolas, monospace" font-size="22" text-anchor="middle">
      <text x="18" y="27">5</text>
      <text x="128" y="27">3</text>
      <text x="275" y="27">7</text>
      <text x="55" y="64">6</text>
      <text x="202" y="64">1</text>
      <text x="18" y="100">9</text>
      <text x="92" y="100">8</text>
      <text x="312" y="100">5</text>
      <text x="18" y="137">8</text>
      <text x="165" y="137">6</text>
      <text x="312" y="137">3</text>
      <text x="128" y="173">8</text>
      <text x="202" y="173">3</text>
      <text x="18" y="210">4</text>
      <text x="165" y="210">8</text>
      <text x="312" y="210">1</text>
      <text x="18" y="247">7</text>
      <text x="92" y="247">2</text>
      <text x="312" y="247">6</text>
      <text x="55" y="283">6</text>
      <text x="202" y="283">2</text>
      <text x="18" y="320">2</text>
      <text x="128" y="320">8</text>
      <text x="275" y="320">9</text>
    </g>
  </g>

  <!-- buttons -->
  <g font-family="Trebuchet MS, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="45" y="405" width="90" height="36" rx="6" fill="#22c55e"/>
    <text x="90" y="428" fill="#ffffff">Solve</text>

    <rect x="165" y="405" width="90" height="36" rx="6" fill="#f59e0b"/>
    <text x="210" y="428" fill="#ffffff">Clear</text>

    <rect x="285" y="405" width="90" height="36" rx="6" fill="#ef4444"/>
    <text x="330" y="428" fill="#ffffff">Exit</text>
  </g>
</svg>
