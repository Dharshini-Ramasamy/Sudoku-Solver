<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="320" fill="url(#bg2)"/>

  <!-- scattered translucent numbers as background texture -->
  <g fill="#ffffff" opacity="0.08" font-family="Arial Black, sans-serif" font-weight="900">
    <text x="40" y="90" font-size="90">7</text>
    <text x="880" y="120" font-size="110">3</text>
    <text x="150" y="290" font-size="80">9</text>
    <text x="760" y="290" font-size="70">4</text>
    <text x="480" y="60" font-size="60">1</text>
    <text x="600" y="300" font-size="90">5</text>
  </g>

  <!-- lightbulb / idea icon representing "solved" -->
  <g transform="translate(90,90)">
    <circle cx="70" cy="70" r="68" fill="#ffffff"/>
    <g transform="translate(35,25)">
      <path d="M35 0 C15 0 0 15 0 35 C0 50 8 58 15 65 C18 68 20 72 20 78 L50 78 C50 72 52 68 55 65 C62 58 70 50 70 35 C70 15 55 0 35 0 Z" fill="#facc15"/>
      <rect x="18" y="78" width="34" height="10" rx="3" fill="#94a3b8"/>
      <rect x="22" y="90" width="26" height="8" rx="3" fill="#64748b"/>
      <path d="M35 15 L35 45 M22 32 L48 32" stroke="#eab308" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- title -->
  <g font-family="Poppins, Verdana, sans-serif">
    <text x="260" y="140" font-size="58" font-weight="bold" fill="#ffffff">Sudoku Solver</text>
    <text x="262" y="180" font-size="20" fill="#fde68a">Crack any puzzle in the blink of an eye ⚡</text>

    <!-- pill badges row -->
    <g font-size="14" font-weight="bold" font-family="Verdana, sans-serif">
      <rect x="262" y="205" width="100" height="32" rx="16" fill="#ffffff"/>
      <text x="312" y="226" text-anchor="middle" fill="#6d28d9">Python</text>

      <rect x="374" y="205" width="100" height="32" rx="16" fill="#ffffff"/>
      <text x="424" y="226" text-anchor="middle" fill="#db2777">Tkinter</text>

      <rect x="486" y="205" width="150" height="32" rx="16" fill="#ffffff"/>
      <text x="561" y="226" text-anchor="middle" fill="#6d28d9">Backtracking</text>
    </g>
  </g>

  <!-- bottom wave decoration -->
  <path d="M0 300 Q 250 260 500 300 T 1000 300 V320 H0 Z" fill="#ffffff" opacity="0.06"/>
</svg>
